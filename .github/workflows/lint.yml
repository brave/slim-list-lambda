name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts skips adblock-rs' native build, which would otherwise
      # pull in a Rust toolchain (see build.sh) just to run the linter.
      - run: npm ci --ignore-scripts

      - run: npm run lint
